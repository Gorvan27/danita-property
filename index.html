const LS={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},
          set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
let lang = LS.get('lang') || 'en';
let sortMode = LS.get('sort') || 'price_asc';
function T(k){return (I18N[lang]&&I18N[lang][k]!=null)?I18N[lang][k]:(I18N.en[k]!=null?I18N.en[k]:k);}
const fmt = n => (n||n===0) ? n.toLocaleString('en-US').replace(/,/g,' ') : '—';
// валюта (курсы приблизительные, для ориентира)
const RATES={THB:1, USD:1/36, EUR:1/38, CNY:1/5, RUB:2.5}, SYM={THB:'฿', USD:'$', EUR:'€', CNY:'¥', RUB:'₽'};
let cur = LS.get('cur') || 'THB';
function money(thb){ if(!thb && thb!==0) return '—'; return fmt(Math.round(thb*RATES[cur]))+' '+SYM[cur]; }
// избранное
let favs = new Set(JSON.parse(LS.get('favs')||'[]'));
let favOnly = false;
function toggleFav(ref){ favs.has(ref)?favs.delete(ref):favs.add(ref); LS.set('favs',JSON.stringify([...favs])); }
function favClick(ref,btn){ toggleFav(ref); const on=favs.has(ref); btn.classList.toggle('on',on); btn.textContent=on?'♥':'♡'; if(favOnly) applyFilters(); }
const isVid = p => /\.mp4$/i.test(p);
const cover = l => l.photos.find(p=>!isVid(p)) || l.photos[0] || '';
// «у моря»: вид на море или прибрежный район
const BEACH=new Set(['Jomtien','Pratumnak','Wongamat','Naklua','Central Pattaya','Na Jomtien','Pattaya City','South Pattaya','North Pattaya','Bang Saray','Cosy Beach']);
let seaOnly=false;
const nearSea = l => /sea/i.test(l.view||'');   // строго: вид на море
let lastRes=[], curView='grid', _map=null, _mk=null;   // для карты

function unitLabel(b){
  if(b===0) return T('studio');
  if(b==null) return T('condo');
  if(lang==='en') return b+' '+(b>1?T('beds'):T('bed'));
  if(lang==='ru') return b+'-комн.';
  if(lang==='zh') return b+'室';
  if(lang==='th') return b+' '+T('beds');
  if(lang==='ja') return b+T('beds');
  return b+' '+T('beds');
}
function dealLabel(d){return d==='rent'?T('rent'):(d==='both'?T('both'):T('sale'));}
function priceLabel(l){
  if(l.deal==='rent') return money(l.rent)+T('per_mo');
  let s = money(l.price);
  if(l.rent) s += ' · '+T('rent_prefix')+' '+money(l.rent)+T('per_mo');
  return s;
}
function floorLabel(f){return f==null?null:(/^\d+$/.test(''+f)?f+' '+T('floor_suffix'):f);}

function socialLinks(){
  const it=[];
  if(C.telegram_bot) it.push([T('soc_bot'),C.telegram_bot,'cta']);
  if(C.telegram_agent) it.push([T('soc_tg'),C.telegram_agent]);
  if(C.whatsapp) it.push([T('soc_wa'),C.whatsapp]);
  if(C.line) it.push([T('soc_line'),C.line]);
  if(C.facebook) it.push([T('soc_fb'),C.facebook]);
  if(C.instagram) it.push([T('soc_ig'),C.instagram]);
  if(C.phone) it.push(['📞 '+C.phone,'tel:'+C.phone.replace(/[^+\d]/g,'')]);
  if(C.email) it.push([T('soc_email'),C.email.startsWith('mailto')?C.email:'mailto:'+C.email]);
  return it.map(([t,u,cls])=>`<a class="${cls||''}" href="${u}" target="_blank" rel="noopener">${t}</a>`).join('');
}

function fillStatic(){
  document.documentElement.lang = lang;
  const hero=document.getElementById('hero');
  if(C.hero_image){hero.src=C.hero_image;hero.style.display='block';document.getElementById('hdr').classList.add('with-hero');}
  document.getElementById('brand').textContent=C.brand;
  document.getElementById('brand-f').textContent=C.brand;
  document.getElementById('tagline').textContent=T('tagline');
  document.getElementById('agent-note').textContent=T('agent_note');
  document.getElementById('footer-note').textContent=T('footer_note');
  document.getElementById('social-top').innerHTML=socialLinks();
  document.getElementById('social-bot').innerHTML=socialLinks();
  const av=document.getElementById('avatar');
  if(C.agent_photo){av.classList.add('has-photo');av.innerHTML=`<img src="${C.agent_photo}" alt="${C.agent_name||''}">`;}
  else{av.textContent=(C.agent_name||'DS').split(/\s+/).map(w=>w[0]||'').join('').slice(0,2).toUpperCase();}
  // фильтры
  document.getElementById('q').placeholder=T('ph_search');
  document.querySelector('#area option[value=""]').textContent=T('all_areas');
  const dsel=document.getElementById('deal').options;
  dsel[0].textContent=T('deal_all');dsel[1].textContent=T('deal_sale');dsel[2].textContent=T('deal_rent');
  const psel=document.getElementById('ptype').options;
  psel[0].textContent=T('all_types');psel[1].textContent=T('t_condo');psel[2].textContent=T('t_villa');
  psel[3].textContent=T('t_townhouse');psel[4].textContent=T('t_house');
  const bdsel=document.getElementById('beds').options;
  bdsel[0].textContent=T('beds_any');bdsel[1].textContent=T('studio');
  bdsel[2].textContent='1';bdsel[3].textContent='2';bdsel[4].textContent='3+';
  document.getElementById('favtoggle').title=T('fav_show');
  document.getElementById('seatoggle').title=T('sea_near');
  const bsel=document.getElementById('budget').options;
  bsel[0].textContent=T('any_price');
  ['2M','3M','5M','8M','15M'].forEach((s,i)=>bsel[i+1].textContent=T('upto')+' '+s+' ฿');
  const ssel=document.getElementById('sort').options;
  ssel[0].textContent=T('sort_asc');ssel[1].textContent=T('sort_desc');
  const vb=document.querySelectorAll('#view button');
  vb[0].textContent=T('view_grid');vb[1].textContent=T('view_row');vb[2].textContent=T('view_map');
}

function card(l){
  const metaBits=[unitLabel(l.beds),l.size?l.size+' '+T('sqm'):null,l.area].filter(Boolean);
  const fav=favs.has(l.ref);
  return `<div class="card" onclick="openModal('${l.ref}')">
    <div class="ph"><img loading="lazy" src="${cover(l)}" alt="${l.ref}">
      <div class="badge">${l.ref}</div>
      <button class="heart ${fav?'on':''}" title="♥" onclick="event.stopPropagation();favClick('${l.ref}',this)">${fav?'♥':'♡'}</button></div>
    <div class="body">
      <span class="deal ${l.deal==='rent'?'rent':''}">${dealLabel(l.deal)}</span>
      <p class="price">${priceLabel(l)}</p>
      <p class="title">${unitLabel(l.beds)}${l.project?' · '+l.project:''}</p>
      <div class="meta">${metaBits.map(m=>'<span>'+m+'</span>').join('')}</div>
    </div></div>`;
}

function applyFilters(){
  const q=document.getElementById('q').value.trim().toLowerCase();
  const area=document.getElementById('area').value;
  const deal=document.getElementById('deal').value;
  const ptype=document.getElementById('ptype').value;
  const beds=document.getElementById('beds').value;
  const budget=+document.getElementById('budget').value||0;
  let res=DATA.filter(l=>{
    if(favOnly && !favs.has(l.ref)) return false;
    if(seaOnly && !nearSea(l)) return false;
    if(area && l.area!==area) return false;
    if(ptype && l.type!==ptype) return false;
    if(beds!==''){ const b=+beds; if(b>=3){ if(!(l.beds>=3)) return false;} else if(l.beds!==b) return false; }
    if(deal==='sale' && !(l.deal==='sale'||l.deal==='both')) return false;
    if(deal==='rent' && !(l.deal==='rent'||l.deal==='both')) return false;
    if(budget){const p=deal==='rent'?l.rent:l.price; if(!p||p>budget) return false;}
    if(q){const hay=(l.project+' '+l.area+' '+l.ref).toLowerCase(); if(!hay.includes(q)) return false;}
    return true;
  });
  const key=l=>(l.deal==='rent'?l.rent:l.price)||0;
  res.sort((a,b)=>sortMode==='price_desc'?key(b)-key(a):key(a)-key(b));
  lastRes=res;
  document.getElementById('grid').innerHTML = res.length?res.map(card).join(''):`<div class="empty">${T('empty')}</div>`;
  document.getElementById('count').textContent = T('count').replace('{n}',res.length);
  if(curView==='map') renderMap();
}
function renderMap(){
  if(!window.L) return;
  const el=document.getElementById('map');
  if(!_map){
    _map=L.map(el).setView([12.925,100.888],13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(_map);
    _mk=L.layerGroup().addTo(_map);
  }
  setTimeout(()=>_map.invalidateSize(),60);
  _mk.clearLayers();
  const pts=[];
  (lastRes||[]).forEach(l=>{
    if(!l.ll) return;
    const la=l.ll[0]+(Math.random()-0.5)*0.001, ln=l.ll[1]+(Math.random()-0.5)*0.001;
    const price=money(l.deal==='rent'?l.rent:l.price);
    const m=L.marker([la,ln]).bindPopup(
      `<div class="mpop"><img src="${cover(l)}" onclick="openFromMap('${l.ref}')"><b>${price}</b><div class="mp2">${l.project||l.ref} · ${l.ref}</div></div>`);
    pts.push([la,ln]); _mk.addLayer(m);
  });
  if(pts.length) _map.fitBounds(pts,{padding:[30,30],maxZoom:15});
}
function openFromMap(ref){ if(_map) _map.closePopup(); openModal(ref); }

function row(label,val){return val?`<div>${label}<span>${val}</span></div>`:'';}
function openModal(ref){
  const l=DATA.find(x=>x.ref===ref); if(!l) return;
  const gal=l.photos.map(p=>isVid(p)
    ?`<video controls preload="metadata" src="${p}"></video>`
    :`<img src="${p}" alt="">`).join('');
  const bot = C.telegram_bot?`<a class="cta" href="${C.telegram_bot}" target="_blank" rel="noopener">${T('btn_bot')}</a>`:'';
  const agent = C.telegram_agent?`<a class="cta2" href="${C.telegram_agent}" target="_blank" rel="noopener">${T('btn_agent')}</a>`:'';
  const share = `<a class="cta2" href="#${l.ref}" onclick="copyLink('${l.ref}');return false;">${T('copy_link')}</a>`;
  const sim = DATA.filter(x=>x.ref!==l.ref && x.area===l.area).slice(0,3);
  const simHtml = sim.length?`<div class="similar"><h3>${T('similar_title')}</h3><div class="simgrid">${sim.map(s=>
    `<div class="simcard" onclick="openModal('${s.ref}')"><img src="${cover(s)}"><div class="sc"><b>${money(s.deal==='rent'?s.rent:s.price)}</b><br>${s.project||s.ref}</div></div>`).join('')}</div></div>`:'';
  document.getElementById('sheet').innerHTML=`
    <div class="gallery">${gal}</div>
    <div class="info">
      <h2>${unitLabel(l.beds)}${l.project?' · '+l.project:''}</h2>
      <p class="sub">${l.ref} · ${l.area}</p>
      <div class="rows">
        ${row(T('lbl_price'), l.deal!=='rent'?money(l.price):'')}
        ${row(T('lbl_rent'), l.rent?money(l.rent)+T('per_mo'):'')}
        ${row(T('lbl_type'), unitLabel(l.beds))}
        ${row(T('lbl_size'), l.size?l.size+' '+T('sqm'):'')}
        ${row(T('lbl_floor'), floorLabel(l.floor))}
        ${row(T('lbl_view'), l.view)}
        ${row(T('lbl_quota'), l.quota)}
        ${row(T('lbl_area'), l.area)}
      </div>
      <div class="actions">${bot}${agent}${share}</div>
      ${simHtml}
    </div>`;
  document.getElementById('modal').classList.add('open');
  document.body.style.overflow='hidden';
  history.replaceState(null,'','#'+ref);
}
function copyLink(ref){
  const u=location.origin+location.pathname+'#'+ref;
  if(navigator.clipboard) navigator.clipboard.writeText(u);
  alert(T('copied'));
}
function closeModal(){document.getElementById('modal').classList.remove('open');document.body.style.overflow='';history.replaceState(null,'',location.pathname);}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

// районы (значения — как есть, не переводятся)
const areaSel=document.getElementById('area');
[...new Set(DATA.map(l=>l.area).filter(Boolean))].sort().forEach(a=>{
  const o=document.createElement('option');o.value=a;o.textContent=a;areaSel.appendChild(o);});

['q','area','deal','ptype','beds','budget'].forEach(id=>document.getElementById(id).addEventListener('input',applyFilters));
document.getElementById('cur').addEventListener('change',e=>{cur=e.target.value;LS.set('cur',cur);applyFilters();});
document.getElementById('favtoggle').addEventListener('click',e=>{favOnly=!favOnly;e.currentTarget.classList.toggle('on',favOnly);applyFilters();});
document.getElementById('seatoggle').addEventListener('click',e=>{seaOnly=!seaOnly;e.currentTarget.classList.toggle('on',seaOnly);applyFilters();});
document.getElementById('sort').addEventListener('change',e=>{sortMode=e.target.value;LS.set('sort',sortMode);applyFilters();});
function setLang(l){lang=l;LS.set('lang',l);document.getElementById('lang').value=l;fillStatic();applyFilters();closeModal();}
document.getElementById('lang').addEventListener('change',e=>setLang(e.target.value));

// тема / вид / масштаб
const SIZES=[340,290,250,205,175,150];
function setDensity(i){i=Math.max(0,Math.min(SIZES.length-1,+i));
  document.documentElement.style.setProperty('--cardw',SIZES[i]+'px');
  document.getElementById('zoom').value=i;LS.set('density',i);}
function setView(v){
  curView=v;
  const g=document.getElementById('grid'), mp=document.getElementById('map');
  if(v==='map'){ g.style.display='none'; mp.style.display='block'; renderMap(); }
  else { mp.style.display='none'; g.style.display=''; g.className=v; }
  document.querySelectorAll('#view button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  LS.set('view',v);}
function setTheme(t){document.documentElement.setAttribute('data-theme',t);
  document.getElementById('theme').textContent=t==='light'?'☀️':'🌙';LS.set('theme',t);}
document.getElementById('zoom').addEventListener('input',e=>setDensity(e.target.value));
document.querySelectorAll('#view button').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.v)));
document.getElementById('theme').addEventListener('click',()=>
  setTheme(document.documentElement.getAttribute('data-theme')==='light'?'dark':'light'));

// init
document.getElementById('sort').value=sortMode;
document.getElementById('cur').value=cur;
setTheme(LS.get('theme')||'dark');
setView(LS.get('view')||'grid');
setDensity(LS.get('density')??3);
setLang(lang);
if(location.hash.length>1){const ref=decodeURIComponent(location.hash.slice(1)); if(DATA.some(x=>x.ref===ref)) openModal(ref);}
</script>
</body>
